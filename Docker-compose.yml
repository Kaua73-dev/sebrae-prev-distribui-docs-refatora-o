services:
  mysql:
    image: mysql:8.4
    container_name: sebrae-prev-distribui-docs-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: