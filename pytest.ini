[pytest]
testpaths = tests

# O codigo de envio e assincrono (DispatchSender.send, MailService.send_files).
# SEM esta linha, o pytest coleta o teste async, NAO executa, e pinta VERDE.
# asyncio_mode = auto faz qualquer "async def test_..." rodar de verdade.
asyncio_mode = auto

# -q = saida curta. --strict-markers = errar o nome de um mark vira erro, nao silencio.
addopts = --strict-markers
